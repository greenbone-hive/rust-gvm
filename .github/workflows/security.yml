name: Security

on:
  push:
    branches: [main, devel]
    paths-ignore:
      - 'journal/**'
      - 'docs/**'
      - 'spec/**'
      - '*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    # Keep the workflow running for docs-only PRs so branch protection always
    # receives the required `Security` status check.
    branches: [main, devel]
  merge_group:
    types: [checks_requested]
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  # Release qualification dispatches this complete workflow at the selected
  # protected-main commit.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_AUDIT_VERSION: "0.22.1"
  CARGO_CYCLONEDX_VERSION: "0.5.9"
  CARGO_GEIGER_VERSION: "0.14.0"
  CARGO_MACHETE_VERSION: "0.9.1"
  CARGO_VET_VERSION: "0.10.3"
  SBOMQS_VERSION: "v2.0.5"
  SBOM_QUALITY_THRESHOLD: "8.3"

jobs:
  # Rust advisory database check
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: rustfmt
          cache-key: cargo-security-audit-${{ runner.os }}-${{ runner.arch }}-stable-${{ env.CARGO_AUDIT_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-audit
        run: cargo install cargo-audit@${{ env.CARGO_AUDIT_VERSION }} --locked
      - name: Run cargo-audit
        run: cargo audit

  # Check for unused dependencies
  cargo-machete:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: rustfmt
          cache-key: cargo-security-machete-${{ runner.os }}-${{ runner.arch }}-stable-${{ env.CARGO_MACHETE_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-machete
        run: cargo install cargo-machete@${{ env.CARGO_MACHETE_VERSION }} --locked
      - name: Run cargo-machete
        run: cargo machete

  # Track dependency audit coverage and block unvetted updates
  cargo-vet:
    name: Cargo Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: rustfmt
          cache-key: cargo-security-vet-${{ runner.os }}-${{ runner.arch }}-stable-${{ env.CARGO_VET_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-vet
        run: cargo install cargo-vet@${{ env.CARGO_VET_VERSION }} --locked
      - name: Run cargo-vet
        run: cargo vet

  # Generate, enrich, and enforce the release SBOM quality policy before tags.
  sbom-quality:
    name: SBOM Quality
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned release verification dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r .github/requirements/release.txt
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: rustfmt
          cache-key: cargo-security-sbom-${{ runner.os }}-${{ runner.arch }}-stable-${{ env.CARGO_CYCLONEDX_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx@${{ env.CARGO_CYCLONEDX_VERSION }} --locked

      - name: Test SBOM and release policy helpers
        run: >-
          python3 -B -m unittest
          tests.test_sbom_postprocess
          tests.test_sbom_quality
          tests.test_release_commit
          tests.test_verify_release
          tests.test_wait_for_release_run
          -q

      - name: Generate CycloneDX SBOMs
        run: >-
          cargo cyclonedx --format json --all --all-features --target all
          --spec-version 1.5

      - name: Collect and post-process SBOMs
        shell: bash
        run: |
          mkdir -p sbom-artifacts
          find crates -name '*.cdx.json' -exec cp {} sbom-artifacts/ \;
          python3 scripts/sbom_postprocess.py \
            --cargo-toml Cargo.toml \
            --declare-dependency-complete \
            sbom-artifacts/*.cdx.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install sbomqs
        run: |
          go install github.com/interlynk-io/sbomqs/v2@${{ env.SBOMQS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Enforce SBOM quality
        shell: bash
        run: |
          sbomqs score --json sbom-artifacts/*.cdx.json > sbomqs-results.json
          python3 scripts/check_sbom_quality.py \
            --threshold "$SBOM_QUALITY_THRESHOLD" \
            sbomqs-results.json

  # Non-blocking dependency unsafe usage report
  cargo-geiger-report:
    name: Cargo Geiger Report
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: rustfmt
          cache-key: cargo-security-geiger-report-${{ runner.os }}-${{ runner.arch }}-stable-${{ env.CARGO_GEIGER_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-geiger
        run: cargo install cargo-geiger@${{ env.CARGO_GEIGER_VERSION }} --locked
      - name: Generate geiger reports (all workspace crates)
        shell: bash
        run: |
          mkdir -p target/geiger
          crates=(gvm-protocol gvm-gmp gvm-client gvm-connection gvm-mock-server)
          for crate in "${crates[@]}"; do
            cargo geiger \
              --manifest-path "$PWD/crates/$crate/Cargo.toml" \
              --all-features \
              --all-dependencies \
              --output-format Ascii > "target/geiger/${crate}.txt" || true
          done
      - name: Upload geiger artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: cargo-geiger-report
          path: target/geiger

  # Blocking check: our crates must not use unsafe
  cargo-geiger-workspace-gate:
    name: Cargo Geiger Workspace Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: rustfmt
          cache-key: cargo-security-geiger-gate-${{ runner.os }}-${{ runner.arch }}-stable-${{ env.CARGO_GEIGER_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-geiger
        run: cargo install cargo-geiger@${{ env.CARGO_GEIGER_VERSION }} --locked
      - name: Fail if workspace crates use unsafe
        run: python3 scripts/check_workspace_unsafe.py

  # OSSF Scorecard (supply chain security)
  # Requires public repo — enable when repo visibility changes
  # scorecard:
  #   name: OpenSSF Scorecard
  #   runs-on: ubuntu-latest
  #   if: github.event_name != 'pull_request'
  #   permissions:
  #     security-events: write
  #     id-token: write
  #   steps:
  #     - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
  #       with:
  #         egress-policy: audit
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
  #         persist-credentials: false
  #     - name: Run Scorecard
  #       uses: ossf/scorecard-action@v2.4.3
  #       with:
  #         results_file: results.sarif
  #         results_format: sarif
  #         publish_results: true
  #     - name: Upload SARIF
  #       uses: github/codeql-action/upload-sarif@v4
  #       if: always()
  #       with:
  #         sarif_file: results.sarif

  # Semgrep SAST (static application security testing)
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Semgrep
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/src:ro" \
            --workdir /src \
            semgrep/semgrep:1.176.1@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823 \
            semgrep scan --error \
            --config p/rust \
            --config p/security-audit \
            --config p/secrets \
            --sarif > semgrep.raw.sarif
          jq '.runs[].tool.driver.name = "Semgrep"' \
            semgrep.raw.sarif > semgrep.normalized.sarif
          mv semgrep.normalized.sarif semgrep.sarif
      - name: Upload SARIF
        # Code scanning must be enabled for the repo for SARIF upload to work.
        # For private repos, this requires GitHub Advanced Security (GHAS).
        # Making this non-blocking until code scanning is enabled.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif

  security:
    name: Security
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - cargo-audit
      - cargo-machete
      - cargo-vet
      - sbom-quality
      - cargo-geiger-report
      - cargo-geiger-workspace-gate
      - semgrep
    steps:
      - name: Require all security jobs to pass
        env:
          CARGO_AUDIT_RESULT: ${{ needs.cargo-audit.result }}
          CARGO_MACHETE_RESULT: ${{ needs.cargo-machete.result }}
          CARGO_VET_RESULT: ${{ needs.cargo-vet.result }}
          SBOM_QUALITY_RESULT: ${{ needs.sbom-quality.result }}
          CARGO_GEIGER_REPORT_RESULT: ${{ needs.cargo-geiger-report.result }}
          CARGO_GEIGER_WORKSPACE_GATE_RESULT: ${{ needs.cargo-geiger-workspace-gate.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
        run: |
          test "$CARGO_AUDIT_RESULT" = success
          test "$CARGO_MACHETE_RESULT" = success
          test "$CARGO_VET_RESULT" = success
          test "$SBOM_QUALITY_RESULT" = success
          test "$CARGO_GEIGER_REPORT_RESULT" = success
          test "$CARGO_GEIGER_WORKSPACE_GATE_RESULT" = success
          test "$SEMGREP_RESULT" = success
