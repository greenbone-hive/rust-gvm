# Release workflow — builds and publishes release artifacts when a version tag is pushed.
# Triggered automatically after release-orchestrated.yml creates a tag.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: gvm-mock-server
  # Pinned tool versions for reproducibility
  CARGO_CYCLONEDX_VERSION: "0.5.9"
  SBOMQS_VERSION: "v2.0.5"
  SBOM_QUALITY_THRESHOLD: "8.3"
  CROSS_VERSION: "v0.2.5"

jobs:
  qualify:
    name: Qualify immutable tag
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify exact tag, commit, workspace versions, and lockfile
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release ref must be a v-prefixed tag" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "Checkout does not match release event SHA $RELEASE_SHA" >&2
            exit 1
          fi
          if [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" != "$RELEASE_SHA" ]]; then
            echo "Tag $RELEASE_TAG does not resolve to release event SHA $RELEASE_SHA" >&2
            exit 1
          fi
          python3 scripts/check_release_version.py "$version"

  # Run full test suite before building release artifacts
  test:
    name: Test
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo test --locked --workspace --all-features

  # Publish gvm-mock-server Docker image to GHCR
  container:
    name: Publish GHCR image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/gvm-mock-server
          tags: |
            type=raw,value=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=gvm-mock-server
            org.opencontainers.image.description=Programmable mock GMP server for testing
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: "{{defaultContext}}"
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate container build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/gvm-mock-server
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Build binaries for each target platform
  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: gvm-mock-server-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: gvm-mock-server-linux-arm64
            cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: gvm-mock-server-linux-amd64-musl
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: gvm-mock-server-macos-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: gvm-mock-server-macos-arm64
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: ${{ matrix.target }}

      # Install cross-compilation tools for Linux ARM64
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross --tag ${{ env.CROSS_VERSION }}

      # Install musl tools for static Linux builds
      - name: Install musl-tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Build with cross for cross-compiled targets
      - name: Build (cross)
        if: matrix.cross
        run: cross build --locked --release --target ${{ matrix.target }} -p gvm-mock-server

      # Build natively for same-arch targets
      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --locked --release --target ${{ matrix.target }} -p gvm-mock-server

      # Package the binary
      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz ${{ env.BINARY_NAME }}
          cd ../../..
          shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '${{ matrix.artifact }}.tar.gz'

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

  # Generate SBOM (Software Bill of Materials) in CycloneDX format
  sbom:
    name: Generate SBOM
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2
        with:
          tool: cargo-cyclonedx@${{ env.CARGO_CYCLONEDX_VERSION }}

      - name: Generate CycloneDX SBOM (JSON)
        run: >-
          cargo cyclonedx --format json --all --all-features --target all
          --spec-version 1.5

      - name: Generate CycloneDX SBOM (XML)
        run: >-
          cargo cyclonedx --format xml --all --all-features --target all
          --spec-version 1.5

      - name: Collect SBOMs
        shell: bash
        run: |
          mkdir -p sbom-artifacts
          find . -name '*.cdx.json' -not -path '*/target/*' -not -path '*/fixtures/*' -not -path '*/sbom-artifacts/*' -exec cp {} sbom-artifacts/ \;
          find . -name '*.cdx.xml' -not -path '*/target/*' -not -path '*/fixtures/*' -not -path '*/sbom-artifacts/*' -exec cp {} sbom-artifacts/ \;
          ls -la sbom-artifacts/

      - name: Post-process CycloneDX JSON SBOMs
        shell: bash
        run: |
          python3 scripts/sbom_postprocess.py \
            --cargo-toml Cargo.toml \
            --declare-dependency-complete \
            sbom-artifacts/*.cdx.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install sbomqs
        run: |
          go install github.com/interlynk-io/sbomqs/v2@${{ env.SBOMQS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Score post-processed SBOMs
        shell: bash
        run: |
          sbomqs score --json sbom-artifacts/*.cdx.json > sbomqs-results.json
          python3 scripts/check_sbom_quality.py \
            --threshold "$SBOM_QUALITY_THRESHOLD" \
            sbomqs-results.json

      - name: Package SBOMs
        run: |
          cd sbom-artifacts
          tar czf ../rust-gvm-sbom.tar.gz ./*.cdx.*
          cd ..
          sha256sum rust-gvm-sbom.tar.gz > rust-gvm-sbom.tar.gz.sha256

      - name: Generate SBOM provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: rust-gvm-sbom.tar.gz

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: |
            rust-gvm-sbom.tar.gz
            rust-gvm-sbom.tar.gz.sha256
            sbomqs-results.json

  # Upload artifacts to the GitHub Release created by pontos
  upload-assets:
    name: Upload release assets
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned release verification dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r .github/requirements/release.txt

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify complete staged release assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_release.py assets \
            --directory artifacts \
            --version "${GITHUB_REF_NAME#v}" \
            --supplier "$GITHUB_REPOSITORY_OWNER"

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Wait for release to exist (pontos creates it, may take a moment)
          found=false
          for i in $(seq 1 30); do
            if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" &>/dev/null; then
              echo "✅ Release ${{ github.ref_name }} found"
              found=true
              break
            fi
            echo "Waiting for release... ($i/30)"
            sleep 5
          done
          if [[ "$found" != true ]]; then
            echo "Release ${{ github.ref_name }} was not found" >&2
            exit 1
          fi

          gh release upload "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            artifacts/*.tar.gz artifacts/*.sha256 artifacts/sbomqs-results.json
          echo "✅ Assets uploaded to release ${{ github.ref_name }}"

  verify-release:
    name: Verify published release
    needs: [container, upload-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned release verification dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r .github/requirements/release.txt
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify release and container publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python3 scripts/verify_release.py published \
            --repository "$GITHUB_REPOSITORY" \
            --version "${GITHUB_REF_NAME#v}" \
            --sha "$RELEASE_SHA"
