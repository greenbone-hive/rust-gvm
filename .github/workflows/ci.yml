name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'journal/**'
      - 'docs/**'
      - 'spec/**'
      - '*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    # Keep the workflow running for docs-only PRs so branch protection can
    # require the aggregate `CI` status check without waiting forever.
    branches: [main, devel]
  merge_group:
    types: [checks_requested]
  # Release qualification dispatches this complete workflow at the selected
  # protected-main commit. The E2E handoff remains restricted to push events.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_LLVM_COV_VERSION: "0.9.1"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: rustfmt
          cache-key: cargo-ci-fmt-${{ runner.os }}-${{ runner.arch }}-stable-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: clippy
          cache-key: cargo-ci-clippy-${{ runner.os }}-${{ runner.arch }}-stable-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # Override rust-toolchain.toml so the MSRV lane really uses 1.89.0.
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    strategy:
      matrix:
        rust: [stable, "1.89.0"]  # stable + MSRV
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: ${{ matrix.rust }}
          components: rustfmt
          cache-key: cargo-ci-test-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test --workspace

  test-features:
    name: Test (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: rustfmt
          cache-key: cargo-ci-test-features-${{ runner.os }}-${{ runner.arch }}-stable-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test --workspace --all-features

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-Dwarnings"
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: rustfmt
          cache-key: cargo-ci-doc-${{ runner.os }}-${{ runner.arch }}-stable-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo doc --workspace --all-features --no-deps

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: rustfmt
          cache-key: cargo-ci-deny-${{ runner.os }}-${{ runner.arch }}-stable-${{ env.CARGO_DENY_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-deny
        run: cargo install cargo-deny@${{ env.CARGO_DENY_VERSION }} --locked
      - name: Run cargo deny
        run: cargo deny check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: llvm-tools-preview
          cache-key: cargo-ci-coverage-${{ runner.os }}-${{ runner.arch }}-stable-${{ env.CARGO_LLVM_COV_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov@${{ env.CARGO_LLVM_COV_VERSION }} --locked
      - name: Verify the controlled coverage threshold regression
        run: make coverage-policy-test
      - name: Enforce Rust workspace coverage floor
        shell: bash
        run: |
          set -euo pipefail
          source .config/coverage.env
          cargo llvm-cov --workspace --all-features \
            --fail-under-lines "$RUST_COVERAGE_FLOOR" \
            --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only --json \
            --output-path rust-coverage-summary.json
      - name: Measure Python policy helper coverage
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            -r .github/requirements/coverage.txt
          python -m coverage run --branch \
            --include='scripts/sbom_postprocess.py,scripts/check_sbom_quality.py' \
            -m unittest \
            tests.test_sbom_postprocess \
            tests.test_sbom_quality \
            tests.test_workflow_policy
          python -m coverage report --fail-under=100
          python -m coverage xml -o python-coverage.xml
      - name: Publish coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            lcov.info
            rust-coverage-summary.json
            python-coverage.xml
          if-no-files-found: error
          retention-days: 14
      - name: Upload coverage to Codecov (advisory)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info,python-coverage.xml
          disable_search: true
          verbose: true
          # The local cargo-llvm-cov floor is authoritative during an outage.
          fail_ci_if_error: false

  integration:
    name: Integration (python-gvm)
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: rustfmt
          cache-key: cargo-ci-integration-${{ runner.os }}-${{ runner.arch }}-stable-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned Python integration dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r .github/requirements/integration.txt
      - run: make test-integration

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    env:
      # Override rust-toolchain.toml so this gate really uses the MSRV.
      RUSTUP_TOOLCHAIN: "1.89.0"
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: "1.89.0"
          components: rustfmt
          cache-key: cargo-ci-msrv-${{ runner.os }}-${{ runner.arch }}-1.89.0-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo check --workspace --all-features

  ci:
    name: CI
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - fmt
      - clippy
      - test
      - test-features
      - doc
      - deny
      - coverage
      - integration
      - msrv
    steps:
      - name: Require all CI jobs to pass
        env:
          FMT_RESULT: ${{ needs.fmt.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          TEST_RESULT: ${{ needs.test.result }}
          TEST_FEATURES_RESULT: ${{ needs.test-features.result }}
          DOC_RESULT: ${{ needs.doc.result }}
          DENY_RESULT: ${{ needs.deny.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
        run: |
          test "$FMT_RESULT" = success
          test "$CLIPPY_RESULT" = success
          test "$TEST_RESULT" = success
          test "$TEST_FEATURES_RESULT" = success
          test "$DOC_RESULT" = success
          test "$DENY_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$MSRV_RESULT" = success

  trigger-e2e:
    name: Trigger E2E Tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: greenbone/actions/trigger-workflow@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3.36.23
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          repository: clawosiris/rust-gvm-e2e-tests
          workflow: e2e.yml
          ref: main
          inputs: '{"rust-gvm-ref":"${{ github.sha }}"}'
