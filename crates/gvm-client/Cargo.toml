[package]
name = "gvm-client"
description = "High-level async GMP client with version negotiation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
unix-socket-tests = [
    "gvm-connection/unix-socket-tests",
    "gvm-mock-server/unix-socket-tests",
]

[dependencies]
async-trait.workspace = true
gvm-connection.workspace = true
gvm-protocol.workspace = true
gvm-gmp.workspace = true
quick-xml.workspace = true
tokio.workspace = true
thiserror.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
rstest.workspace = true
tokio-test.workspace = true
tempfile.workspace = true
gvm-mock-server.workspace = true

# gvm-client remains a pre-1.0 Technology Preview. Adding an actionable error
# variant therefore requires the next minor release (for example 0.6 -> 0.7),
# not a 1.0 release. Remove this override when the public API stabilizes.
[package.metadata.cargo-semver-checks.lints]
enum_variant_added = { required-update = "minor" }

[lints]
workspace = true
